[theme]
base = "dark"
primaryColor = "#0e7490"   # white text on this colour = ~5.4:1 contrast (WCAG AA)
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#131c2e"
textColor = "#e6edf7"
font = "sans serif"

[server]
maxUploadSize = 5            # MB - matches the app's own limit
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
